# Submits the resolved Maven dependency tree to GitHub's dependency graph, so Dependabot alerts also cover
# versions managed through properties / dependencyManagement (e.g. org.yaml:snakeyaml 1.32).
name: Maven dependency submission
on:
  push:
    branches: [alobreach-demo]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
